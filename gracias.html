<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gracias por tu solicitud</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #e8f5e9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .contenedor {
      background: white;
      padding: 40px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      max-width: 500px;
    }

    h1 {
      color: #1b5e20;
      margin-bottom: 15px;
    }

    p {
      color: #444;
      font-size: 16px;
      margin-bottom: 25px;
    }

    .check {
      font-size: 60px;
      color: #2e7d32;
      margin-bottom: 15px;
    }

    .boton {
      background:#1b5e20;
      color:white;
      padding:12px 25px;
      text-decoration:none;
      border-radius:8px;
      font-size:16px;
      display:inline-block;
      transition:0.3s;
    }

    .boton:hover {
      background:#2e7d32;
      transform:scale(1.05);
    }
  </style>
</head>

<body>

  <div class="contenedor">

    <div class="check">✔</div>

    <h1>¡Gracias por tu PQR!</h1>

    <p>
      Hemos recibido tu solicitud correctamente.  
      Nuestro equipo revisará tu mensaje y dará respuesta lo antes posible.
    </p>

    <a href="index.html" class="boton">
      ⬅ Volver al Inicio
    </a>

  </div>

</body>
</html>
